# ═══════════════════════════════════════════════════════════
#  Narumi Android APK 自动构建 (GitHub Actions)
#   触发: push main(android/** 或本文件) / 手动 / Release
#   产出: Narumi-Debug-APK (Debug 签名, 可直接安装)
# ═══════════════════════════════════════════════════════════
name: Build Narumi APK

on:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK (cmdline-tools)
        run: |
          set -e
          SDK_DIR="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK_DIR/cmdline-tools"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/clt.zip
          unzip -q /tmp/clt.zip -d "$SDK_DIR/cmdline-tools"
          mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept licenses + Install SDK packages
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "--- licenses ---"
          ls "$ANDROID_HOME/licenses/" 2>/dev/null || echo "NO licenses dir!"
          echo "--- sdk ---"
          ls "$ANDROID_HOME"

      - name: Set up Gradle 8.5
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.5/bin" >> "$GITHUB_PATH"

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build Debug APK
        id: build
        working-directory: android
        continue-on-error: true
        run: |
          echo "=== java ==="
          java -version 2>&1 | head -2
          echo "=== gradle ==="
          gradle --version | head -6
          echo "=== local.properties ==="
          cat local.properties
          echo "=== assembleDebug ==="
          gradle assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Upload Debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Narumi-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 发布 APK 到固定 Release (apk-latest): 不过期 + 匿名可下载
      # 相比 Actions Artifact 更稳定, 每次构建都会覆盖更新
      - name: Publish APK to Release (apk-latest)
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Narumi APK (latest)
          body: |
            自动构建的最新 Debug APK (WebView 指向 https://107211.xyz)
            刷新日期: ${{ github.event.head_commit.timestamp }}
          files: android/app/build/outputs/apk/debug/*.apk
          update_release_body: true
          fail_on_unmatched_files: false

      - name: Report error (visible in check annotations)
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Gradle build FAILED. Last 10 log lines:"
          tail -10 /tmp/build.log | sed 's/%/%25/g; s/\r//g' | while IFS= read -r l; do
            echo "::error::LOG:$l"
          done
          exit 1

      - name: Summary
        if: steps.build.outcome == 'success'
        run: |
          echo "=========================================="
          echo "  APK Build Complete!"
          echo "=========================================="
          echo "  下载1 (Release, 永久): https://github.com/nino-natsume/cloud-mail/releases/tag/apk-latest"
          echo "  下载2 (Artifact, 会过期): Actions → 本次运行 → Artifacts"
          echo "=========================================="